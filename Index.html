<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IA Gamer 3.0 - Jugador vs IA</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.game {
    width: 95%;
    max-width: 650px;
    text-align: center;
}

h1 {
    margin-bottom: 5px;
}

#status {
    color: #b8c1ce;
    margin-bottom: 15px;
}

#board {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    width: min(94vw, 560px);
    aspect-ratio: 1;
    margin: auto;
    border: 3px solid #475569;
    border-radius: 12px;
    overflow: hidden;
    background: #0f172a;
}

.cell {
    border: 1px solid #293548;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: clamp(10px, 3vw, 22px);
}

/* Obstáculos */
.wall {
    background: #64748b;
}

/* Jugador */
.player {
    background: #2563eb;
}

/* IA */
.ai {
    background: #7c3aed;
}

/* Campo de visión */
.vision {
    box-shadow: inset 0 0 0 2px #38bdf8;
}

/* Meta */
.goal {
    font-size: clamp(16px, 4vw, 26px);
}

.panel {
    margin: 15px auto;
    padding: 12px;
    max-width: 560px;
    border: 1px solid #334155;
    border-radius: 12px;
    background: #172033;
}

button {
    min-width: 48px;
    min-height: 44px;
    margin: 3px;
    border: 1px solid #475569;
    border-radius: 10px;
    background: #1e293b;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

button:hover {
    background: #334155;
}

#reset {
    padding: 0 18px;
    font-size: 15px;
    font-weight: bold;
}

.info {
    color: #aeb8c7;
    font-size: 14px;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="game">

    <h1>👀🤖 IA Gamer 3.0</h1>

    <div id="status">
        La IA está observando...
    </div>

    <button id="reset">
        🔄 Reiniciar
    </button>

    <div id="board"></div>

    <div class="panel">
        <strong>👀 Visión de la IA</strong>
        <p id="visionText">
            Esperando...
        </p>

        <div class="info">
            La IA observa lo que tiene cerca, detecta obstáculos
            y decide su siguiente movimiento.
        </div>
    </div>

    <!-- Controles -->
    <div>
        <button data-dir="0,-1">⬆️</button>
    </div>

    <div>
        <button data-dir="-1,0">⬅️</button>
        <button data-dir="0,1">⬇️</button>
        <button data-dir="1,0">➡️</button>
    </div>

    <div class="info">
        🎮 También puedes usar WASD o las flechas.
    </div>

    <div class="info">
        🧑 Jugador · 🤖 IA · 🧱 Obstáculo · 🏆 Meta · 🔵 Visión
    </div>

</div>

<script>

const board = document.getElementById("board");
const statusText = document.getElementById("status");
const visionText = document.getElementById("visionText");
const resetButton = document.getElementById("reset");

const WIDTH = 12;
const HEIGHT = 12;

/*
    MAPA
    Cada posición está escrita como:
    "x,y"
*/
const walls = new Set([

    "2,0",
    "2,1",
    "2,2",

    "4,1",
    "5,1",
    "6,1",

    "8,1",
    "8,2",

    "1,4",
    "2,4",
    "3,4",

    "5,3",
    "5,4",
    "5,5",

    "8,4",
    "9,4",

    "3,7",
    "4,7",
    "5,7",

    "7,6",
    "7,7",
    "7,8",

    "9,8",
    "10,8",

    "2,10",
    "3,10",
    "4,10",

    "6,9",
    "6,10"
]);

let player;
let ai;
let goal;

let gameRunning = true;
let aiTimer = null;


/* Convierte coordenadas a texto */
function key(x, y) {
    return x + "," + y;
}


/* Comprueba si una posición está bloqueada */
function blocked(x, y) {

    if (x < 0 || y < 0) {
        return true;
    }

    if (x >= WIDTH || y >= HEIGHT) {
        return true;
    }

    if (walls.has(key(x, y))) {
        return true;
    }

    return false;
}


/*
    VISIÓN DE LA IA

    La IA solamente observa una zona
    cercana a su posición.
*/
function updateVision() {

    let detected = [];

    for (let y = -2; y <= 2; y++) {

        for (let x = -2; x <= 2; x++) {

            if (x === 0 && y === 0) {
                continue;
            }

            const px = ai.x + x;
            const py = ai.y + y;

            if (
                px >= 0 &&
                py >= 0 &&
                px < WIDTH &&
                py < HEIGHT
            ) {

                if (walls.has(key(px, py))) {

                    detected.push("🧱 obstáculo");

                } else if (
                    px === goal.x &&
                    py === goal.y
                ) {

                    detected.push("🏆 meta");
                }
            }
        }
    }


    /*
        Comprueba qué movimientos tiene disponibles.
    */

    const directions = [

        [1, 0, "derecha"],
        [-1, 0, "izquierda"],
        [0, -1, "arriba"],
        [0, 1, "abajo"]

    ];


    const available = directions
        .filter(direction => {

            return !blocked(
                ai.x + direction[0],
                ai.y + direction[1]
            );

        })
        .map(direction => direction[2]);


    if (detected.length > 0) {

        visionText.textContent =
            detected.join(", ") +
            ". Movimientos libres: " +
            available.join(", ");

    } else {

        visionText.textContent =
            "No detecto obstáculos cercanos. " +
            "Movimientos libres: " +
            available.join(", ");
    }
}


/*
    DIBUJA EL MAPA
*/
function draw() {

    board.innerHTML = "";

    for (let y = 0; y < HEIGHT; y++) {

        for (let x = 0; x < WIDTH; x++) {

            const cell = document.createElement("div");

            cell.className = "cell";


            /*
                Campo de visión de la IA
            */

            if (
                Math.abs(x - ai.x) <= 2 &&
                Math.abs(y - ai.y) <= 2
            ) {

                cell.classList.add("vision");
            }


            /*
                Obstáculo
            */

            if (walls.has(key(x, y))) {

                cell.classList.add("wall");
            }


            /*
                Meta
            */

            if (
                x === goal.x &&
                y === goal.y
            ) {

                cell.classList.add("goal");
                cell.textContent = "🏆";
            }


            /*
                Jugador
            */

            if (
                x === player.x &&
                y === player.y
            ) {

                cell.classList.add("player");
                cell.textContent = "🧑";
            }


            /*
                IA
            */

            if (
                x === ai.x &&
                y === ai.y
            ) {

                cell.classList.add("ai");
                cell.textContent = "🤖";
            }


            board.appendChild(cell);
        }
    }


    updateVision();
}


/*
    TERMINAR PARTIDA
*/
function finish(message) {

    gameRunning = false;

    clearInterval(aiTimer);

    aiTimer = null;

    statusText.textContent = message;

    draw();
}


/*
    MOVIMIENTO DEL JUGADOR
*/
function movePlayer(dx, dy) {

    if (!gameRunning) {
        return;
    }


    const newX = player.x + dx;
    const newY = player.y + dy;


    /*
        No puede atravesar paredes
    */

    if (!blocked(newX, newY)) {

        player.x = newX;
        player.y = newY;
    }


    /*
        Victoria
    */

    if (
        player.x === goal.x &&
        player.y === goal.y
    ) {

        finish("🏆 ¡Ganaste! Llegaste antes que la IA.");

        return;
    }


    /*
        Encuentro con IA
    */

    if (
        player.x === ai.x &&
        player.y === ai.y
    ) {

        finish("🤖 ¡La IA te encontró!");

        return;
    }


    draw();
}


/*
    IA

    La IA NO recibe un camino completo.

    Mira sus alrededores y elige
    el movimiento que considera mejor.
*/
function chooseAIMove() {

    const options = [

        [1, 0],
        [-1, 0],
        [0, -1],
        [0, 1]

    ].filter(direction => {

        return !blocked(
            ai.x + direction[0],
            ai.y + direction[1]
        );

    });


    if (options.length === 0) {

        return null;
    }


    /*
        Evaluamos cada movimiento.

        Cuanto menor sea la distancia
        a la meta, mejor parece el movimiento.
    */

    const choices = options.map(direction => {

        const newX = ai.x + direction[0];
        const newY = ai.y + direction[1];


        const distanceToGoal =
            Math.abs(goal.x - newX) +
            Math.abs(goal.y - newY);


        /*
            Pequeña variación para que
            la IA no siempre tome exactamente
            el mismo movimiento.
        */

        const randomness = Math.random() * 2;


        return {

            direction: direction,

            score:
                distanceToGoal +
                randomness
        };

    });


    choices.sort((a, b) => {

        return a.score - b.score;

    });


    return choices[0].direction;
}


/*
    INICIAR PARTIDA
*/
function startGame() {

    clearInterval(aiTimer);


    /*
        Posiciones iniciales
    */

    player = {
        x: 0,
        y: 0
    };


    ai = {
        x: 0,
        y: 11
    };


    goal = {
        x: 11,
        y: 0
    };


    gameRunning = true;


    statusText.textContent =
        "👀 La IA está observando y tomando decisiones...";


    draw();


    /*
        La IA decide cada medio segundo.
    */

    aiTimer = setInterval(() => {

        if (!gameRunning) {
            return;
        }


        const move = chooseAIMove();


        if (!move) {

            finish(
                "🧱 La IA quedó bloqueada."
            );

            return;
        }


        ai.x += move[0];
        ai.y += move[1];


        /*
            IA gana
        */

        if (
            ai.x === goal.x &&
            ai.y === goal.y
        ) {

            finish(
                "🤖🏆 ¡La IA ganó! Llegó primero."
            );

            return;
        }


        /*
            IA encuentra al jugador
        */

        if (
            ai.x === player.x &&
            ai.y === player.y
        ) {

            finish(
                "🤖 ¡La IA te encontró!"
            );

            return;
        }


        draw();

    }, 500);
}


/*
    CONTROLES DEL TECLADO
*/

const keyboard = {

    ArrowUp: [0, -1],
    w: [0, -1],
    W: [0, -1],

    ArrowDown: [0, 1],
    s: [0, 1],
    S: [0, 1],

    ArrowLeft: [-1, 0],
    a: [-1, 0],
    A: [-1, 0],

    ArrowRight: [1, 0],
    d: [1, 0],
    D: [1, 0]
};


document.addEventListener("keydown", event => {

    const move = keyboard[event.key];


    if (move) {

        event.preventDefault();

        movePlayer(
            move[0],
            move[1]
        );
    }

});


/*
    BOTONES TÁCTILES
*/

document
    .querySelectorAll("[data-dir]")
    .forEach(button => {

        button.addEventListener("click", () => {

            const direction =
                button.dataset.dir
                    .split(",")
                    .map(Number);


            movePlayer(
                direction[0],
                direction[1]
            );
        });

    });


/*
    REINICIAR
*/

resetButton.addEventListener(
    "click",
    startGame
);


/*
    ARRANCAR JUEGO
*/

startGame();

</script>

</body>
</html>
